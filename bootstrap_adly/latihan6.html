<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Control</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<body>

    <div class="container mt-3 bg-primary rounded-3">
        <h4 class="text-center text-danger p-6">FORMULIR PENDAFTARAN SISWA BARU</h4>


    <div class="mb-3 form-floating">
    <input type="text" placeholder="Masukkan NIPD" class="form-control">
    <label>Masukkan NIPD</label>
</div>


    <div class="mb-3 form-floating">
    <input type="text" placeholder="Nama Lengkap" class="form-control">
    <label>Nama Lengkap</label>
</div>


<div class="mb-3 form-floating">
    <input type="text" placeholder="Email" class="form-control">
    <label>Email</label>
</div>

<div class="mb-3 form-floating">
    <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
    <label>Alamat Lengkap</label>
</div>

<div class="mb-3 form-floating">
    <select class="form-select">
        <option>Rekayasa Perangkat Lunak</option>
        <option>Teknik Komputer dan Jaringan</option>
        <option>Desain Komunikasi Visual</option>
        <option>Bisnis Digital</option>
        <option>Akuntansi</option>
    </select>
    <label>Pilih Jurusan</label>
    <div class="mb-3">
  <input class="form-check-input" type="checkbox">
  <label class="form-check-label">Ekskul Volly</label>

  <input class="form-check-input" type="checkbox">
  <label class="form-check-label">Ekskul Badminton</label>

  <input class="form-check-input" type="checkbox">
  <label class="form-check-label">Ekskul PMR</label>
</div>

<div class="mb-3" form-check>
    <div class="row">
        <div class="col-6">
  <input class="form-check-input" type="radio" name="radioDisabled">
  <label class="form-check-label">Laki Laki</label>
        </div>

        <div class="col-6">
  <input class="form-check-input" type="radio" name="radioDisabled">
  <label class="form-check-label">Perempuan</label>
</div>

    </div>
<button class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title=" Untuk Simpan Data">Simpan Data</button>
<button class="btn btn-success">Hapus Data</button> 
</body>
</html>
